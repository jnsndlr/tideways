name: Fast CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Seeded traffic diagnostics' || 'Godot fast check' }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 15 || 5 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the test runner
        run: bash tools/fast_ci_runner_test.sh
      - name: Install Godot 4.7.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 2 --silent --show-error -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run game checks
        env:
          SUITE: ${{ github.event_name == 'workflow_dispatch' && 'traffic' || 'fast' }}
        run: bash tools/fast_ci.sh "$SUITE"
